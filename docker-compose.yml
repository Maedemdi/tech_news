services:

  migrate:
    build:
      context: .
      args:
        HTTP_PROXY: http://host.docker.internal:10808
        HTTPS_PROXY: http://host.docker.internal:10808
        NO_PROXY: localhost,127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: django_migrate
    command: python manage.py migrate --noinput
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      args:
        HTTP_PROXY: http://host.docker.internal:10808
        HTTPS_PROXY: http://host.docker.internal:10808
        NO_PROXY: localhost,127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: django_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  celery:
    build:
      context: .
      args:
        HTTP_PROXY: http://host.docker.internal:10808
        HTTPS_PROXY: http://host.docker.internal:10808
        NO_PROXY: localhost,127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: celery_worker
    command: celery -A TechNews worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  celery_beat:
    build:
      context: .
      args:
        HTTP_PROXY: http://host.docker.internal:10808
        HTTPS_PROXY: http://host.docker.internal:10808
        NO_PROXY: localhost,127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: celery_beat
    command: >
      sh -c "python manage.py shell -c
      'from News_app.beat_setup import scraper_beat_task; scraper_beat_task()'
      && celery -A TechNews beat --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: redis
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: